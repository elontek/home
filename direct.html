<main class="page" id="main">
  <h1>Geri bildirim</h1>
  <p class="lead">Sitede hata varsa, öneriniz varsa ya da listede olmayan bir cihaz istiyorsanız yazın.</p>
  <form class="form" id="feedback-form">
    <div class="field"><label for="f-name">Adınız</label><input id="f-name" type="text" name="name" autocomplete="name" required></div>
    <div class="field"><label for="f-email">E-posta</label><input id="f-email" type="email" name="email" autocomplete="email" required></div>
    <div class="field"><label for="f-msg">Mesajınız</label><textarea id="f-msg" name="message" required></textarea></div>
    <button class="btn" type="submit" id="submit-btn">Gönder</button>
    <p class="status" id="form-message" role="status"></p>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="theme.js"></script>
<script>
emailjs.init("qOX1uwv6NNuIFrpjU");
const form = document.getElementById("feedback-form"), btn = document.getElementById("submit-btn"), msg = document.getElementById("form-message");
form.addEventListener("submit", function (event) {
  event.preventDefault();
  btn.disabled = true; btn.textContent = "Gönderiliyor…"; msg.className = "status"; msg.textContent = "";
  emailjs.sendForm('service_9mh711z', 'template_ea8m9he', this).then(function () {
    msg.className = "status ok"; msg.textContent = "Mesaj gönderildi, teşekkürler.";
    btn.textContent = "Gönder"; btn.disabled = false; form.reset();
  }, function (error) {
    msg.className = "status err"; msg.textContent = "Mesaj gönderilemedi. Birkaç dakika sonra tekrar deneyin.";
    btn.textContent = "Gönder"; btn.disabled = false; console.error("EmailJS hata:", error);
  });
});
</script>
